      - name: Install Capacitor
        working-directory: app
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Offline font (Vazirmatn)
        working-directory: app
        continue-on-error: true
        run: |
          npm i @fontsource/vazirmatn
          F=node_modules/@fontsource/vazirmatn/files
          mkdir -p www/fonts
          CSS=""
          for w in 400 600 800; do
            for s in arabic latin; do
              cp "$F/vazirmatn-$s-$w-normal.woff2" www/fonts/
              if [ "$s" = arabic ]; then R="U+0600-06FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE80-FEFC"; else R="U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD"; fi
              CSS="$CSS@font-face{font-family:Vazirmatn;font-weight:$w;font-display:swap;src:url(fonts/vazirmatn-$s-$w-normal.woff2) format('woff2');unicode-range:$R}"
            done
          done
          python3 - "$CSS" <<'PY'
          import sys,re
          p='www/index.html'
          h=open(p,encoding='utf-8').read()
          h=re.sub(r'<link href="https://fonts.googleapis[^>]*>','<style>'+sys.argv[1]+'</style>',h,count=1)
          open(p,'w',encoding='utf-8').write(h)
          PY

      - name: Create Android project
        working-directory: app
        run: |
          npx cap init Voltira ir.voltira.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Set app icon
        working-directory: app
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert icon.png -resize ${s}x${s} $R/mipmap-$n/$f.png
            done
          done

      - name: Build APK
        working-directory: app/android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../Voltira.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Voltira-APK
          path: Voltira.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Voltira v${{ github.run_number }}
          files: Voltira.apk
